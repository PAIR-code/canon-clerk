[package]
name = "canon-clerk"
version = "0.1.0"
edition = "2024"
authors = ["PAIR-code"]
license = "Apache-2.0"
description = "Automated review gate enforcing declarative engineering rule packs"
readme = "README.md"
repository = "https://github.com/PAIR-code/canon-clerk"

[lib]
name = "canon_clerk"
path = "src/lib.rs"

[[bin]]
name = "canon-clerk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[profile.dev]
debug = 0

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
redundant_clone = "deny"
cloned_instead_of_copied = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

