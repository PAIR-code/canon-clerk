[package]
name = "canon-clerk"
version = "0.1.0"
edition = "2024"
authors = ["PAIR-code"]
license = "Apache-2.0"
description = "Automated review gate enforcing declarative engineering rule packs"
readme = "README.md"
repository = "https://github.com/PAIR-code/canon-clerk"

[lib]
name = "canon_clerk"
path = "src/lib.rs"

[[bin]]
name = "canon-clerk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

