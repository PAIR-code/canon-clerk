name: "Lint PR Title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate:
    name: "Validate PR Title"
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Permitted commit types established in issue #4
          types: |
            feat
            fix
            spec
            docs
            chore
            build
            ci
            test
            refactor
            perf
            revert
          # Permitted scopes representing our monorepo surfaces
          scopes: |
            cli
            action
            core
            canon
            canons
            agents
            spec
            deps
            readme
          requireScope: false
          # Conventional Commits regex pattern supporting optional scopes and breaking change indicator (!)
          headerPattern: '^(\w+)(?:\(([\w\$\.\-\*\s]+)\))?\!?:\s([^\n\r]+)$'
          headerPatternCorrespondence: type,scope,subject
