name: "Canon Clerk"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate Canons"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check canon corpus taxonomy
        run: ./scripts/check-canons.sh

      - name: Set up Rust toolchain
        run: rustup show active-toolchain --verbose

      - name: Build Canon Clerk
        run: cargo build --locked

      - name: Validate repository canons
        run: ./target/debug/canon-clerk -v validate --all-canons --max-warnings 0
