name: "Repository Metadata"

on:
  push:
    branches:
      - main
    paths:
      - ".github/settings.yml"
      - ".github/workflows/repo-metadata.yml"
      - ".github/scripts/repo_settings.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/settings.yml"
      - ".github/workflows/repo-metadata.yml"
      - ".github/scripts/repo_settings.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate & Dry-Run"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Dry-run settings synchronization
        run: python3 .github/scripts/repo_settings.py check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync:
    name: "Synchronize Metadata"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Synchronize repository settings
        run: python3 .github/scripts/repo_settings.py sync
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
