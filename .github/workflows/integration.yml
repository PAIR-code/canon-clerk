name: "Integration"

on:
  push:
    branches:
      - main
    paths:
      - "packages/core/**"
      - "packages/configuration/**"
      - "packages/schema/**"
      - "packages/integration-tests-private/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/core/**"
      - "packages/configuration/**"
      - "packages/schema/**"
      - "packages/integration-tests-private/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: "Live Service Integration (Node 24.x)"
    runs-on: ubuntu-latest

    # Non-hermetic live service tests require GEMINI_API_KEY repository secret.
    # Excluded from routine ci.yml per .canons/internal/ci-verification-steps-must-have-local-check-parity.md.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run live service integration tests
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Notice: GEMINI_API_KEY secret is not present (e.g. fork PR). Running integration harness in skip mode."
            export CANON_CLERK_SKIP_LIVE_TESTS=1
          fi
          npm run test:integration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
